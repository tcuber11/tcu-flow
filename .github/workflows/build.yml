# Builds every installer: macOS (universal dmg + the .app.tar.gz the in-app updater installs; Developer ID
# signed and notarized when the Apple secrets are set, ad-hoc signed otherwise), Windows (nsis), Linux (deb, rpm,
# AppImage), Android (apk, signed when the keystore secrets are set) and iOS (uploaded to TestFlight when the
# Apple secrets are set; see docs/guides/apple-signing.md).
# On a push to main the installers are workflow artifacts. When a GitHub release is published they are also
# attached to it; then run `node scripts/release.mjs vX.Y.Z` locally to sign them into latest.json (the updater
# key never leaves the maintainer's machine).
name: Build installers

on:
  workflow_dispatch:
  push:
    branches: [main]
  release:
    types: [published]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  macos:
    # Apple Silicon by default. When GitHub runs short of those (jobs end "cancelled" without a runner), the
    # repository variable MAC_RUNNER=macos-15-intel moves the build to an Intel Mac: the same universal app.
    runs-on: ${{ vars.MAC_RUNNER || 'macos-latest' }}
    steps:
      - uses: actions/checkout@v5
      # screencapturekit's Metal bridge needs the macOS 26 SDK; an Intel image starts on an older Xcode
      - name: Newest Xcode (Intel runner)
        if: runner.arch == 'X64'
        run: |
          x=$(ls -d /Applications/Xcode_2[6-9]*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$x" ]; then echo "::error::no Xcode 26 or later on this image: unset MAC_RUNNER and wait for Apple Silicon runners"; exit 1; fi
          sudo xcode-select -s "$x"
          xcodebuild -version
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      # With APPLE_CERTIFICATE (Developer ID Application .p12) tauri imports it into a temporary keychain, signs
      # with the hardened runtime and notarizes through the App Store Connect API key. Without the secrets the
      # variables must stay unset (an empty APPLE_CERTIFICATE makes tauri try to import nothing and fail), so
      # they are exported only when present; the build then falls back to the ad-hoc signature ("-"). The test is in
      # the shell: a step's own env is not something its `if:` can rely on.
      - name: Apple signing environment (only when the secrets are set)
        env:
          CERT: ${{ secrets.APPLE_CERTIFICATE }}
          CERT_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
          ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          KEY_ID: ${{ secrets.APPLE_API_KEY }}
          KEY_B64: ${{ secrets.APPLE_API_KEY_B64 }}
        run: |
          if [ -z "$CERT" ]; then echo "No Apple certificate: ad-hoc signature"; exit 0; fi
          {
            echo "APPLE_CERTIFICATE=$CERT"
            echo "APPLE_CERTIFICATE_PASSWORD=$CERT_PASSWORD"
            echo "APPLE_SIGNING_IDENTITY=$IDENTITY"
            echo "APPLE_TEAM_ID=$TEAM"
          } >> "$GITHUB_ENV"
          # notarizing takes Apple up to 40 minutes: releases and manual runs only, pushes stay signed
          if [ -n "$KEY_B64" ] && [ "$GITHUB_EVENT_NAME" != push ]; then
            echo "$KEY_B64" | base64 -d > "$RUNNER_TEMP/AuthKey.p8"
            {
              echo "APPLE_API_ISSUER=$ISSUER"
              echo "APPLE_API_KEY=$KEY_ID"
              echo "APPLE_API_KEY_PATH=$RUNNER_TEMP/AuthKey.p8"
            } >> "$GITHUB_ENV"
          fi
      - run: npx tauri build --target universal-apple-darwin --bundles app,dmg
      # what the in-app updater downloads: the .app itself, packed as tauri's own updater bundle would
      - name: Pack the app for updates
        run: |
          cd src-tauri/target/universal-apple-darwin/release/bundle/macos
          COPYFILE_DISABLE=1 tar -czf "TCuFlow_$(node -p "require('../../../../../tauri.conf.json').version")_universal.app.tar.gz" TCuFlow.app
      - uses: actions/upload-artifact@v4
        with:
          name: TCuFlow-macos
          path: |
            src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
            src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz
          if-no-files-found: error
      - if: github.event_name == 'release'
        run: gh release upload "$GITHUB_REF_NAME" src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz --clobber
        env:
          GH_TOKEN: ${{ github.token }}

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npx tauri build --bundles nsis
      - uses: actions/upload-artifact@v4
        with:
          name: TCuFlow-windows
          path: src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
      - if: github.event_name == 'release'
        shell: bash
        run: gh release upload "$GITHUB_REF_NAME" src-tauri/target/release/bundle/nsis/*-setup.exe --clobber
        env:
          GH_TOKEN: ${{ github.token }}

  windows-arm64:
    # Surface and other Snapdragon laptops; GitHub's public arm64 Windows runner
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npx tauri build --bundles nsis --target aarch64-pc-windows-msvc
      - uses: actions/upload-artifact@v4
        with:
          name: TCuFlow-windows-arm64
          path: src-tauri/target/aarch64-pc-windows-msvc/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
      - if: github.event_name == 'release'
        shell: bash
        run: gh release upload "$GITHUB_REF_NAME" src-tauri/target/aarch64-pc-windows-msvc/release/bundle/nsis/*-setup.exe --clobber
        env:
          GH_TOKEN: ${{ github.token }}

  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      # Tauri's WebKitGTK stack, plus ALSA for cpal and X11 headers for the input layer
      - run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf libasound2-dev libx11-dev libxtst-dev
      - run: npm ci
      - run: npx tauri build --bundles deb,rpm,appimage
      - uses: actions/upload-artifact@v4
        with:
          name: TCuFlow-linux
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error
      - if: github.event_name == 'release'
        run: gh release upload "$GITHUB_REF_NAME" src-tauri/target/release/bundle/deb/*.deb src-tauri/target/release/bundle/rpm/*.rpm src-tauri/target/release/bundle/appimage/*.AppImage --clobber
        env:
          GH_TOKEN: ${{ github.token }}

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0 ndk;27.2.12479018
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      # release signing key from the repository secrets (scripts/android-keystore.md); unsigned without it
      - if: env.ANDROID_KEYSTORE_B64 != ''
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          echo "$ANDROID_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/tcuflow-android.jks"
          printf 'storeFile=%s\npassword=%s\nkeyAlias=tcuflow\n' "$RUNNER_TEMP/tcuflow-android.jks" "$ANDROID_KEYSTORE_PASSWORD" > src-tauri/gen/android/keystore.properties
      - run: npx tauri android build --apk --target aarch64 armv7
        env:
          NDK_HOME: ${{ env.ANDROID_SDK_ROOT }}/ndk/27.2.12479018
      - name: Name the apk
        run: |
          v=$(node -p "require('./src-tauri/tauri.conf.json').version")
          f=$(ls src-tauri/gen/android/app/build/outputs/apk/universal/release/*.apk | head -1)
          mkdir -p out && cp "$f" "out/TCuFlow_${v}_android.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: TCuFlow-android
          path: out/*.apk
          if-no-files-found: error
      - if: github.event_name == 'release'
        run: gh release upload "$GITHUB_REF_NAME" out/*.apk --clobber
        env:
          GH_TOKEN: ${{ github.token }}

  # Whether the iOS job has anything to do, decided on a Linux runner: without the iOS secrets it would hold a
  # macOS runner (scarce at times, and the Mac build needs one) only to skip every step.
  ios-gate:
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    outputs:
      ok: ${{ steps.gate.outputs.ok }}
    steps:
      - id: gate
        env:
          HAVE: ${{ secrets.IOS_CERTIFICATE != '' && secrets.IOS_PROVISIONING_PROFILE != '' && secrets.APPLE_API_KEY_B64 != '' }}
        run: echo "ok=$HAVE" >> "$GITHUB_OUTPUT"

  ios:
    # TestFlight upload; needs the Apple secrets (docs/guides/apple-signing.md), skipped without them
    needs: ios-gate
    if: needs.ios-gate.outputs.ok == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      # Apple Distribution certificate into a throwaway keychain, the App Store provisioning profile where Xcode
      # looks, and the App Store Connect API key for the upload
      - uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.IOS_CERTIFICATE }}
          p12-password: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
      - env:
          PROFILE_B64: ${{ secrets.IOS_PROVISIONING_PROFILE }}
          APPLE_API_KEY_B64: ${{ secrets.APPLE_API_KEY_B64 }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        run: |
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles ~/.appstoreconnect/private_keys
          echo "$PROFILE_B64" | base64 -d > ~/Library/MobileDevice/Provisioning\ Profiles/tcuflow.mobileprovision
          echo "$APPLE_API_KEY_B64" | base64 -d > ~/.appstoreconnect/private_keys/AuthKey_${APPLE_API_KEY}.p8
      - run: npx tauri ios build --export-method app-store-connect
        env:
          APPLE_DEVELOPMENT_TEAM: ${{ secrets.APPLE_TEAM_ID }}
      # one upload per version: its build number is the version, and TestFlight refuses the same one twice, so
      # pushes and manual runs only check that the signed build works
      - if: github.event_name == 'release'
        run: xcrun altool --upload-app --type ios --file src-tauri/gen/apple/build/arm64/tcuflow.ipa --apiKey "$APPLE_API_KEY" --apiIssuer "$APPLE_API_ISSUER"
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      - uses: actions/upload-artifact@v4
        with:
          name: TCuFlow-ios
          path: src-tauri/gen/apple/build/arm64/*.ipa
          if-no-files-found: error
